<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091522">
  <meta name="description" content="《我们都认识他》校园反诈互动推理游戏">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=18">
  <title>我们都认识他｜校园反诈互动推理</title>
</head>
<body>
  <noscript>本游戏需要启用 JavaScript。</noscript>

  <main id="homeView" class="view home-view">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <section class="home-shell">
      <p class="eyebrow">校园反诈互动推理游戏</p>
      <h1>我们都认识他</h1>
      <p class="hook">三句真话，可能指向一个假结论。</p>
      <div class="rule"></div>
      <p class="intro">我是校园媒体学生林知夏。旧片、合同、视频和几个人的说法都在我面前；每次先查什么、先保住什么，都会把事情带向不同的地方。</p>

      <section class="build-card glass-card" aria-label="当前版本">
        <div><span>自然叙事优化版 v1.6.0</span><strong>12次选择 · 6个结局</strong></div>
        <p>人物、聊天和零散材料会被记进手记。林知夏只是边走边记，她当时的猜测也可能出错。</p>
      </section>

      <div class="home-actions">
        <button id="continueButton" class="button primary hidden">继续调查</button>
        <button id="newButton" class="button secondary">开始调查</button>
      </div>

      <aside class="tip"><strong>事情一开始很普通</strong><span>“学姐，能帮我看一下这个报名链接吗？”</span></aside>
    </section>
  </main>

  <main id="gameView" class="view game-view hidden">
    <header class="topbar">
      <button id="homeButton" class="icon-button" aria-label="返回首页">‹</button>
      <div class="progress-wrap">
        <div class="progress-meta"><span id="chapterLabel">调查中</span><span id="progressLabel">0%</span></div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="progressFill"></div></div>
      </div>
      <button id="audioButton" class="icon-button audio-button" aria-label="开关配音">静</button>
    </header>

    <div class="game-layout">
      <section class="visual-column">
        <div id="meta" class="meta"></div>
        <figure class="media-frame glass-card">
          <video id="sceneVideo" class="scene-media hidden" muted loop autoplay playsinline></video>
          <img id="sceneImage" class="scene-media motion-image" alt="">
          <div id="chatScene" class="chat-scene hidden" aria-label="聊天记录"></div>
          <figcaption id="mediaBadge" class="media-badge hidden">无声运镜</figcaption>
        </figure>
      </section>

      <section class="story-column">
        <article id="narrativePanel" class="narrative" aria-live="polite">
          <div id="modeStrip" class="mode-strip">
            <span id="modeIcon" class="mode-icon"></span>
            <div><strong id="modeLabel"></strong><small id="modeNote"></small></div>
          </div>
          <p id="heading" class="scene-heading"></p>
          <section id="orientationCard" class="orientation-card hidden" aria-label="本段调查路标">
            <span id="orientationKicker" class="orientation-kicker"></span>
            <strong id="orientationRoute" class="orientation-route"></strong>
            <p id="orientationGoal" class="orientation-goal"></p>
          </section>
          <section id="contextNotes" class="context-notes hidden" aria-label="知夏手记">
            <header><span>刚记下一条</span><strong>知夏手记</strong></header>
            <div id="contextNotesBody"></div>
          </section>
          <p id="speaker" class="speaker"></p>
          <span id="pageMarker" class="page-marker hidden"></span>
          <p id="dialogue" class="dialogue"></p>
        </article>
        <div id="choices" class="choices"></div>
        <div id="chapterEnd" class="chapter-end glass-card hidden">
          <span id="endingCode" class="ending-code"></span>
          <strong id="endingTitle">事情落在这里</strong>
          <p id="endingText"></p>
          <div id="endingDetails" class="ending-details"></div>
          <p id="endingEducation" class="ending-education"></p>
          <button id="replayButton" class="button secondary">从头再查一次</button>
        </div>
        <div class="story-actions">
          <button id="stepBackButton" class="button step-back-button" disabled>退回上一步</button>
          <button id="nextButton" class="button next-button">继续调查</button>
        </div>
        <button id="skipIntroButton" class="text-button hidden">直接查看那条陌生私信</button>
      </section>
    </div>

    <nav class="toolbelt" aria-label="调查工具">
      <button id="evidenceButton"><span id="evidenceCount" class="count">0</span><span>证据册</span></button>
      <button id="charactersButton"><span id="charactersCount" class="count">0</span><span>人物</span></button>
      <button id="statusButton"><span id="statusCount" class="count">0</span><span>状态卡</span></button>
      <button id="glossaryButton"><span id="glossaryCount" class="count">0</span><span>手记</span></button>
      <button id="restartButton"><span class="count">↺</span><span>重新开始</span></button>
    </nav>
  </main>

  <div id="sceneTransition" class="scene-transition hidden" aria-hidden="true">
    <div class="scene-transition-panel">
      <span id="transitionIcon" class="transition-icon"></span>
      <strong id="transitionTitle"></strong>
      <p id="transitionSubtitle"></p>
    </div>
  </div>

  <div id="drawerMask" class="drawer-mask hidden"></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <header><h2 id="drawerTitle">证据册</h2><button id="drawerClose" aria-label="关闭">×</button></header>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <dialog id="confirmDialog">
    <form method="dialog">
      <h2>从头再查一次？</h2>
      <p>我现在记下的选择、证据和进度都会被清空。</p>
      <div class="dialog-actions"><button value="cancel" class="button secondary">取消</button><button value="confirm" class="button primary">重新开始</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js?v=29"></script>
</body>
</html>
