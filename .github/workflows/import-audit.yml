name: Import audited trial build

on:
  push:
    branches: [trial-audit-20261011]

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'LiMingyangTHU/we-know-him-game'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish exact local commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "035337dc5a750ddd5b783d18c85ed70ec12e5d09"
          git bundle verify .github/workflows/publish-audit.bundle
          git fetch .github/workflows/publish-audit.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "744f1a85baea66e3a515805e4e6bb5dcc2cf4dc4"
          git merge-base --is-ancestor origin/main FETCH_HEAD
          git push origin FETCH_HEAD:refs/heads/main
